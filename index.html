<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mining Pool</title>
  <meta name="description" content="Multi-coin mining pool — live stats, PPLNS and SOLO pools, miner dashboard.">
  <meta name="theme-color" content="#060606">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" id="brand"></a>
      <nav class="mainnav" id="mainnav">
        <a href="#/connect" data-nav="connect"><svg viewBox="0 0 24 24"><path d="M9 7H6a5 5 0 0 0 0 10h3m6-10h3a5 5 0 0 1 0 10h-3M8 12h8"/></svg>Connect</a>
        <a href="#/dashboard" data-nav="dashboard"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/></svg>Dashboard</a>
        <a href="#/pools" data-nav="pools"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Pools</a>
        <a href="#/blocks" data-nav="blocks"><svg viewBox="0 0 24 24"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>Blocks</a>
        <a href="#/api" data-nav="api"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5"/></svg>API</a>
        <a href="#/faq" data-nav="faq"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.3-2.5 3.8M12 17.2v.1"/></svg>FAQ</a>
      </nav>
      <div class="topbar-right">
        <span class="live-pill" id="live-pill" title="Live connection status"><i></i><span>Live</span></span>
        <a class="toplink" id="toplink-telegram" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24"><path d="M21 4 3 11l6 2.3M21 4l-3 16-9-6.7M21 4 9 13.3V19l3-3"/></svg>Telegram</a>
        <button class="menu-btn" id="menu-btn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </div>
  </header>

  <div class="demo-banner" id="demo-banner" hidden>
    Showing demo data — the Miningcore API at <code id="demo-api"></code> could not be reached. Set <code>apiBase</code> in <code>config.js</code>.
  </div>

  <main id="app" class="app" aria-live="polite"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-left"><span id="footer-brand" class="brand small"></span><span class="muted" id="footer-copy"></span></div>
      <div class="footer-links">
        <a href="#/connect">Connect</a><a href="#/pools">Pools</a><a href="#/faq">FAQ</a><a href="#/api">API</a>
      </div>
    </div>
  </footer>

  <div class="toasts" id="toasts"></div>

  <script src="config.js"></script>
  <script src="js/format.js"></script>
  <script src="js/api.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
