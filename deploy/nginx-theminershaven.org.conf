# nginx site for the pool front end + Miningcore API.
# Install:
#   sudo cp nginx-theminershaven.org.conf /etc/nginx/sites-available/theminershaven.org.conf
#   sudo ln -sf /etc/nginx/sites-available/theminershaven.org.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS afterwards:
#   sudo certbot --nginx -d theminershaven.org -d www.theminershaven.org
server {
    listen 80;
    listen [::]:80;
    server_name theminershaven.org www.theminershaven.org;

    access_log /var/log/nginx/theminershaven.org.access.log;
    error_log  /var/log/nginx/theminershaven.org.error.log;

    root /var/www/pool-ui;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /notifications {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
